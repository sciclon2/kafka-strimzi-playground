apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafbat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafbat
  template:
    metadata:
      labels:
        app: kafbat
    spec:
      containers:
      - name: kafbat
        image: ghcr.io/kafbat/kafka-ui:latest
        ports:
        - containerPort: 8081
        env:
        - name: KAFKA_CLUSTERS_0_NAME
          value: payments
        - name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS
          value: payments-kafka-kafka-bootstrap:9092
        - name: DYNAMIC_CONFIG_ENABLED
          value: "true"
        - name: SERVER_PORT
          value: "8081"
