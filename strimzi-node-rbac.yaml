apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: strimzi-node-reader
rules:
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: strimzi-node-reader-binding
subjects:
- kind: ServiceAccount
  name: strimzi-cluster-operator
  namespace: strimzi
roleRef:
  kind: ClusterRole
  name: strimzi-node-reader
  apiGroup: rbac.authorization.k8s.io
